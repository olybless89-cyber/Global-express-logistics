# Render Blueprint for VEXO LOGISTICS (PHP + PostgreSQL)
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: vexo-db
    plan: basic_256mb
    region: frankfurt
    postgresMajorVersion: "17"

services:
  - type: web
    name: vexo-logistics
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vexo-db
          property: connectionString
      - key: SITE_URL
        value: https://vexologistics.online
      - key: SITE_EMAIL
        value: support@vexologistics.online
      # Admin login (supplied at deploy time, never committed):
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
